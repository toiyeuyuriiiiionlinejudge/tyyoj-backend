[package]
name = "tyyoj-backend"
version = "0.1.0"
edition = "2021"
authors = ["toiyeuyuriiiii & nmkdeveloper"]
license = "MIT"
repository = "https://github.com/toiyeuyuriiiiionlinejudge/tyyoj-backend"
description = "Core REST API & Podman Judger Fleet Orchestrator for Toi Yêu Yuri Online Judge"

[dependencies]
tyyoj-contracts = { path = "../tyyoj-contracts" }
axum = "0.8.9"
tokio = { version = "1.54.1", features = ["full"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "uuid"] }
bollard = "0.21.1"
lettre = { version = "0.11.23", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder"] }
redis = { version = "1.8.1", features = ["tokio-comp", "aio"] }
argon2 = "0.6.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
